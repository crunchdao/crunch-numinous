[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "crunch-numinous"
version = "1.0.1"
description = "Numinous Crunch Starter Package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic",

    # not directly used, but kept for the notebook
    "rich",
    "aiohttp",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["numinous"]

[tool.pytest.ini_options]
testpaths = ["tests"]
